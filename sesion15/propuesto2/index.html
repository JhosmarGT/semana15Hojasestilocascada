
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propuesto 2 - Formulario de Contacto</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-2xl p-8 rounded-xl shadow-lg">

        <h1 class="text-3xl font-bold text-center text-indigo-700 mb-3">
            Formulario de Contacto
        </h1>

        <p class="text-gray-500 text-center mb-8">
            Completa los siguientes campos para comunicarte con nosotros.
        </p>

        <form class="space-y-5">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div>
                    <label for="nombre" class="block font-semibold mb-2">
                        Nombre completo
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ingresa tu nombre"
                        class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:ring-4 focus:ring-indigo-300 focus:border-indigo-500"
                        required>
                </div>

                <div>
                    <label for="correo" class="block font-semibold mb-2">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        placeholder="ejemplo@gmail.com"
                        class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:ring-4 focus:ring-indigo-300 focus:border-indigo-500"
                        required>
                </div>

            </div>

            <div>
                <label for="asunto" class="block font-semibold mb-2">
                    Asunto
                </label>

                <input
                    type="text"
                    id="asunto"
                    placeholder="Escribe el asunto"
                    class="w-full border border-gray-300 rounded-lg p-3 outline-none focus:ring-4 focus:ring-indigo-300 focus:border-indigo-500"
                    required>
            </div>

            <div>
                <label for="mensaje" class="block font-semibold mb-2">
                    Mensaje
                </label>

                <textarea
                    id="mensaje"
                    rows="5"
                    placeholder="Escribe tu mensaje aquí..."
                    class="w-full border border-gray-300 rounded-lg p-3 outline-none resize-none focus:ring-4 focus:ring-indigo-300 focus:border-indigo-500"
                    required></textarea>
            </div>

            <div>
                <button
                    type="submit"
                    class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-300 transition">

                    Enviar mensaje

                </button>
            </div>

        </form>

        <p class="text-center text-gray-400 text-sm mt-6">
            © 2026 - Formulario de contacto
        </p>

    </div>

</body>
</html>
